name: Prototype checks

on:
  push:
    branches: [main, develop, 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:theme-build
      - run: npx playwright install --with-deps chromium
      - name: Browser regression checks
        id: e2e
        run: npm run test:e2e -- --reporter=line --max-failures=1 --global-timeout=900000
      - name: Upload failed browser diagnostics
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  answer-clearing-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Isolated v3 browser regression
        id: e2e-v3
        run: npx playwright test --config=playwright.v3.config.ts --reporter=line --max-failures=1 --global-timeout=600000
      - name: Upload failed v3 browser diagnostics
        if: ${{ failure() && steps.e2e-v3.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-v3-diagnostics-${{ github.run_attempt }}
          path: test-results-v3/
          retention-days: 7
          if-no-files-found: ignore
