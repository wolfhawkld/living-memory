name: "💡 功能建议"
description: "描述需要解决的阅读、记忆、场景调用或知识维护问题"
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议。请先说明需要解决的问题、预期结果和边界；不需要提出技术实现方案。

        请只使用合成数据或已脱敏的材料。请勿粘贴账号、密码、cookie、token、个人知识库内容或个人学习记录。疑似安全漏洞请勿公开提交 Issue，请通过 [GitHub Security Advisories 私下报告](https://github.com/wolfhawkld/living-memory/security/advisories/new)。

  - type: checkboxes
    id: submission-checks
    attributes:
      label: 提交前确认
      description: 请确认下面各项后再提交。
      options:
        - label: 我已搜索现有 Issues，确认没有相同或高度相似的建议。
          required: true
        - label: 我只会提供合成数据或已脱敏材料，不会包含账号、cookie、token、个人知识库内容或个人学习记录。
          required: true
        - label: 我已了解疑似安全漏洞应使用私下安全报告入口，不在公开 Issue 披露细节。
          required: true

  - type: dropdown
    id: primary-scenario
    attributes:
      label: 主要场景
      description: 这个建议主要改善哪类工作？
      options:
        - 阅读与查询
        - 记忆与复习
        - 场景调用
        - 知识整理与维护
        - 跨场景或其他
      multiple: false
    validations:
      required: true

  - type: textarea
    id: problem-to-solve
    attributes:
      label: 要解决的问题
      description: 请描述谁在什么阅读、记忆、场景调用或知识维护流程中遇到什么阻碍，以及当前影响。请聚焦问题和结果，不要求提供实现方案。
      placeholder: |
        例如：在准备某类工作时，我能找到相关笔记，但无法快速判断哪些概念值得先回忆，导致……
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: 预期行为
      description: 描述理想的用户流程、可观察结果和一个具体使用例子。
      placeholder: |
        例如：用户输入一个工作场景后，系统应展示……，并允许用户……。
    validations:
      required: true

  - type: textarea
    id: scope-and-boundaries
    attributes:
      label: 范围与边界（可选）
      description: 请说明建议应包含什么、明确不包含什么，以及如何判断完成；不要求给出技术实现方案。
      placeholder: |
        包含：……
        不包含：……
        完成判断：……
    validations:
      required: false

  - type: textarea
    id: research-basis
    attributes:
      label: 研究依据（可选）
      description: 仅当建议会改变记忆模型行为（例如衰减、重温、回忆或场景调用判断、状态更新）时填写研究依据、公开链接、证据范围和不确定性；其他建议可留空。
      placeholder: 公开论文或资料链接，以及它支持的具体行为和证据边界。
    validations:
      required: false

  - type: textarea
    id: related-context
    attributes:
      label: 相关背景（可选）
      description: 可添加公开 Issue、文档、合成示例或其他有助于理解问题的上下文。
      placeholder: 公开链接或不含敏感信息的补充说明。
    validations:
      required: false
