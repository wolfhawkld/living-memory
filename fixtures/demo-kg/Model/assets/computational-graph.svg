<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">计算图示例：f = x × y + z</title>
  <desc id="desc">输入 x 等于 2、y 等于 3、z 等于 1，依次经过乘法和加法得到结果 7。</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/>
    </marker>
  </defs>

  <rect width="960" height="360" rx="24" fill="#0f172a"/>
  <text x="48" y="52" fill="#f8fafc" font-family="sans-serif" font-size="24" font-weight="700">计算图示例 · Computational Graph</text>
  <text x="48" y="82" fill="#cbd5e1" font-family="sans-serif" font-size="18">f = x × y + z</text>

  <g fill="none" stroke="#93c5fd" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M 212 140 C 260 140, 270 140, 318 140"/>
    <path d="M 212 220 C 260 220, 270 170, 318 170"/>
    <path d="M 212 294 C 392 294, 470 238, 548 194"/>
    <path d="M 502 155 L 548 155"/>
    <path d="M 732 155 L 786 155"/>
  </g>

  <g font-family="sans-serif" text-anchor="middle">
    <rect x="48" y="112" width="164" height="56" rx="14" fill="#1d4ed8"/>
    <text x="130" y="137" fill="#dbeafe" font-size="14">输入 · Input</text>
    <text x="130" y="157" fill="#ffffff" font-size="19" font-weight="700">x = 2</text>

    <rect x="48" y="192" width="164" height="56" rx="14" fill="#1d4ed8"/>
    <text x="130" y="217" fill="#dbeafe" font-size="14">输入 · Input</text>
    <text x="130" y="237" fill="#ffffff" font-size="19" font-weight="700">y = 3</text>

    <rect x="48" y="272" width="164" height="56" rx="14" fill="#1d4ed8"/>
    <text x="130" y="297" fill="#dbeafe" font-size="14">输入 · Input</text>
    <text x="130" y="317" fill="#ffffff" font-size="19" font-weight="700">z = 1</text>

    <rect x="318" y="112" width="184" height="88" rx="16" fill="#0f766e"/>
    <text x="410" y="145" fill="#ccfbf1" font-size="14">乘法 · Multiply</text>
    <text x="410" y="173" fill="#ffffff" font-size="20" font-weight="700">x × y = 6</text>

    <rect x="548" y="112" width="184" height="88" rx="16" fill="#7c3aed"/>
    <text x="640" y="145" fill="#ede9fe" font-size="14">加法 · Add</text>
    <text x="640" y="173" fill="#ffffff" font-size="20" font-weight="700">6 + z = 7</text>

    <rect x="786" y="112" width="126" height="88" rx="16" fill="#b45309"/>
    <text x="849" y="145" fill="#fef3c7" font-size="14">结果 · Result</text>
    <text x="849" y="173" fill="#ffffff" font-size="22" font-weight="700">f = 7</text>
  </g>
</svg>
